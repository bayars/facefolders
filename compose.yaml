# Usage:
#   PHOTOS_DIR=/path/to/photos OUTPUT_DIR=/path/to/output docker compose run --rm face-sorter
#   ... docker compose run --rm face-sorter --recluster --min-samples 1
services:
  face-sorter:
    build: .
    image: face-sorter
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ${PHOTOS_DIR:?set PHOTOS_DIR}:/photos:ro
      - ${OUTPUT_DIR:?set OUTPUT_DIR}:/out
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
